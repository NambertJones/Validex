# Hosted demo on Render (synthetic data only). ENVIRONMENT=demo seeds the demo accounts;
# use ENVIRONMENT=production for a real deployment (no demo accounts, SECRET_KEY mandatory).
services:
  - type: web
    name: validex-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    envVars:
      - key: ENVIRONMENT
        value: demo
      - key: SECRET_KEY
        generateValue: true
      - key: USE_MINIO
        value: "false"
      - key: CORS_ORIGINS
        value: https://YOUR-FRONTEND.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: validex-db
          property: connectionString

databases:
  - name: validex-db
    databaseName: aicte_validation
    user: aicte
    plan: free
    region: singapore
