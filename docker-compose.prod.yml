services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aicte}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aicte_prod_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-aicte_validation}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aicte} -d ${POSTGRES_DB:-aicte_validation}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-validex_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-validex_storage_secret}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aicte}:${POSTGRES_PASSWORD:-aicte_prod_secret_2026}@postgres:5432/${POSTGRES_DB:-aicte_validation}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-validex_admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-validex_storage_secret}
      MINIO_BUCKET: aicte-documents
      MINIO_SECURE: "false"
      SECRET_KEY: ${SECRET_KEY:-validex-super-secret-jwt-key-2026-production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "120"
      CORS_ORIGINS: "*"

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    command: celery -A app.worker.celery worker --loglevel=info --concurrency=4
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aicte}:${POSTGRES_PASSWORD:-aicte_prod_secret_2026}@postgres:5432/${POSTGRES_DB:-aicte_validation}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-validex_admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-validex_storage_secret}
      MINIO_BUCKET: aicte-documents
      MINIO_SECURE: "false"
      SECRET_KEY: ${SECRET_KEY:-validex-super-secret-jwt-key-2026-production}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  minio_data:
