services:
  - type: web
    name: validex-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    envVars:
      - key: APP_NAME
        value: Validex
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: validex-db
          property: connectionString

databases:
  - name: validex-db
    databaseName: aicte_validation
    user: aicte
    plan: free
    region: singapore
